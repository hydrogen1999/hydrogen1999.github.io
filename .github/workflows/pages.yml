name: Deploy mirrored site to Pages

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/pages.yml"]
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout shared website source
        uses: actions/checkout@v4
        with:
          repository: thinhnguyencong/thinhnguyencong.github.io
          ref: main
          persist-credentials: false

      - name: Validate static site
        run: |
          test -s site/index.html
          for script in site/*.js; do
            node --check "$script"
          done

      - name: Version scripts with the source commit
        run: |
          source_sha="$(git rev-parse HEAD)"
          sed -i "s/?v=dev/?v=${source_sha:0:7}/g" site/index.html
          printf 'Website source: %s\n' "$source_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
